<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>作品 · 孤雪摄影 | Guxue Photography</title>
  <meta name="description" content="孤雪摄影作品集 — 心情、风景、旅行、夜景分类浏览。">
  <meta property="og:title" content="作品 · 孤雪摄影">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 导航 -->
  <header class="nav is-scrolled" id="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">孤雪<span>摄影</span></a>
      <nav class="nav__links">
        <a href="index.html#home">首页</a>
        <a href="gallery.html">作品</a>
        <a href="index.html#about">关于</a>
        <a href="index.html#contact">联系</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="菜单">☰</button>
    </div>
  </header>

  <!-- 页头（背景复用 images/hero/1.jpg，也可单独放 images/page-hero.jpg） -->
  <section class="page-hero">
    <img class="page-hero__bg" src="images/hero/1.jpg" onerror="this.onerror=null;this.src='https://picsum.photos/seed/guxue-pagehero/1920/900'" alt="">
    <div class="page-hero__inner">
      <h1>作品集</h1>
      <p>Portfolio · 心情 / 风景 / 旅行 / 夜景</p>
    </div>
  </section>

  <!-- 作品 -->
  <section class="section">
    <div class="container">
      <div class="filters">
        <button class="filter-btn is-active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="mood">心情</button>
        <button class="filter-btn" data-filter="landscape">风景</button>
        <button class="filter-btn" data-filter="travel">旅行</button>
        <button class="filter-btn" data-filter="night">夜景</button>
      </div>

      <!-- 作品条目由 js/main.js 根据 images/ 下各分类实际照片自动生成：
           命名规则 images/<分类>/1.jpg、2.jpg … 连续编号即可，放入即显示，无需改代码 -->
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <div class="footer__logo">孤雪摄影</div>
      <div class="footer__tag">GUXUE PHOTOGRAPHY</div>
      <div class="footer__copy">© 2026 孤雪摄影 · 保留所有权利</div>
    </div>
  </footer>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox__close" id="lightboxClose" aria-label="关闭">✕</button>
    <button class="lightbox__arrow lightbox__arrow--prev" id="lightboxPrev" aria-label="上一张">‹</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox__arrow lightbox__arrow--next" id="lightboxNext" aria-label="下一张">›</button>
    <div class="lightbox__caption" id="lightboxCaption"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
